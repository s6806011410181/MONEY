<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบชำระเงิน - แจ้งโอนสลิป</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 600px;
            margin: 20px auto;
        }

        .summary-box {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .due-amount {
            font-size: 2.5em;
            color: #d32f2f;
            font-weight: bold;
            margin: 10px 0;
        }

        .pay-button {
            background: #4CAF50;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .pay-button:hover {
            background: #388e3c;
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .upload-area {
            border: 2px dashed #3b82f6;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            background: #eff6ff;
            margin-bottom: 15px;
            position: relative;
        }

        .upload-area:hover {
            background: #e0f2fe;
        }

        .upload-area img {
            max-width: 100%;
            max-height: 250px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .status-msg {
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
            font-size: 0.9em;
            min-height: 20px;
        }

        .confirm-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.2s;
        }

        .confirm-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .confirm-btn:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .history-section {
            margin-top: 30px;
            text-align: left;
        }

        .history-header {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .history-item {
            background: white;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #fafafa;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-Confirmed {
            background: #dcfce7;
            color: #166534;
        }

        canvas {
            display: none;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            cursor: pointer;
            font-size: 28px;
            color: #aaa;
        }

        .close-btn:hover {
            color: #333;
        }

        .qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #feb2b2;
            text-align: center;
        }

        .qr-image {
            width: 100%;
            max-width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ระบบแจ้งโอนเงิน</h1>
        <div class="summary-box">
            <p style="margin:0; color:#666;">ยอดค้างชำระล่าสุด</p>
            <div class="due-amount" id="current-balance">กำลังโหลด...</div>
            <button class="pay-button" onclick="openModal()">💳 แนบสลิป / แจ้งโอนเงิน</button>

            <div class="qr-section">
                <p style="margin-bottom: 10px; font-weight: bold; color: #555;">สแกนเพื่อโอนเงิน</p>
                <img src="3194.jpg" alt="QR Code สำหรับโอนเงิน" class="qr-image">
                <p style="font-size: 0.9em; color: #777; margin-top: 8px;">นาย บูรพา สิงคิ</p>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">ประวัติการโอนล่าสุด</div>
            <div id="transfer-list">
                <p style="text-align:center; color: gray;">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="text-align:center; margin-top: 0; color:#333;">แจ้งชำระเงิน</h2>
            <div class="upload-area" onclick="document.getElementById('fileIn').click()">
                <input type="file" id="fileIn" accept="image/*" hidden onchange="handleFile(event)">
                <p id="uploadText" style="color:#2563eb;">📷 แตะเพื่อเลือกรูปสลิป</p>
                <img id="previewImg">
            </div>
            <div id="status" class="status-msg"></div>
            <div class="input-group">
                <label>จำนวนเงิน (บาท):</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01">
            </div>
            <button class="confirm-btn" id="submitBtn" onclick="submitData()">ยืนยันการโอนเงิน</button>
            <canvas id="procCanvas"></canvas>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby5PcVstBG_ehT3mY4uAZBraUMfM6-lQVCtlZvSunLZrYhtcQDEL8LY1CVcpYjjBYuk/exec";
        let worker = null;
        let base64Image = "";

        async function initWorker() {
            if (worker) return;
            document.getElementById('status').innerText = "⏳ กำลังโหลดระบบสแกนสลิป...";
            try { worker = await Tesseract.createWorker('tha+eng'); document.getElementById('status').innerText = ""; }
            catch (e) { console.error(e); document.getElementById('status').innerText = "⚠️ ระบบสแกนไม่พร้อม (กรอกมือได้)"; }
        }

        function openModal() { document.getElementById('paymentModal').style.display = 'flex'; initWorker(); }
        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
            document.getElementById('amount').value = "";
            document.getElementById('previewImg').style.display = "none";
            document.getElementById('uploadText').style.display = "block";
            base64Image = "";
            document.getElementById('status').innerText = "";
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (event) {
                base64Image = event.target.result;
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const preview = document.getElementById('previewImg');
                    preview.src = img.src; preview.style.display = 'block';
                    document.getElementById('uploadText').style.display = 'none';
                    const canvas = document.getElementById('procCanvas');
                    const ctx = canvas.getContext('2d');
                    const scale = 1000 / img.width;
                    canvas.width = 1000; canvas.height = img.height * scale;
                    ctx.filter = 'contrast(125%) brightness(105%)';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    runOCR(canvas.toDataURL('image/jpeg', 0.8));
                };
            };
            reader.readAsDataURL(file);
        }

        async function runOCR(imageData) {
            if (!worker) return;
            document.getElementById('status').innerText = "🤖 AI กำลังอ่านยอดเงิน...";
            try {
                const { data: { text } } = await worker.recognize(imageData);
                const lines = text.split('\n');
                let foundAmount = "";
                for (let line of lines) {
                    line = line.replace(/\s/g, '');
                    const match = line.match(/[\d,]+\.\d{2}/);
                    if (match) { foundAmount = match[0].replace(/,/g, ''); break; }
                }
                if (foundAmount) {
                    document.getElementById('amount').value = foundAmount;
                    document.getElementById('status').innerText = "✅ อ่านยอดเงินสำเร็จ: " + foundAmount;
                } else { document.getElementById('status').innerText = "⚠️ อ่านยอดไม่เจอ โปรดระบุเอง"; }
            } catch (err) { document.getElementById('status').innerText = "❌ สแกนอัตโนมัติล้มเหลว"; }
        }

        function submitData() {
            const amount = document.getElementById('amount').value;
            const fileIn = document.getElementById('fileIn').files[0];
            const btn = document.getElementById('submitBtn');
            if (!amount || !base64Image) { alert("กรุณาเลือกรูปสลิป และตรวจสอบจำนวนเงิน"); return; }
            btn.disabled = true; btn.innerText = "กำลังส่งข้อมูล...";
            const payload = { amount: amount, fileName: fileIn ? fileIn.name : "slip.jpg", fileType: fileIn ? fileIn.type : "image/jpeg", file: base64Image };
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => { if (data.success) { alert("✅ บันทึกข้อมูลสำเร็จ!"); closeModal(); loadData(); } else { alert("เกิดข้อผิดพลาด: " + data.message); } })
                .catch(err => { alert("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: " + err); })
                .finally(() => { btn.disabled = false; btn.innerText = "ยืนยันการโอนเงิน"; });
        }

        function loadData() {
            const listEl = document.getElementById('transfer-list');
            const balanceEl = document.getElementById('current-balance');

            fetch(GAS_URL + "?action=getList")
                .then(res => res.json())
                .then(data => {
                    listEl.innerHTML = "";
                    if (data && data.length > 0) {
                        // ดึงยอดจาก displayBalance ใน GAS (คอลัมน์ E แถวสุดท้าย)
                        const lastBalance = data[0].displayBalance;
                        if (balanceEl) {
                            balanceEl.innerText = parseFloat(lastBalance).toLocaleString(undefined, {
                                minimumFractionDigits: 2, maximumFractionDigits: 2
                            }) + " บาท";
                        }

                        data.forEach(item => {
                            let displayDate = item.date;

                            // ตรวจสอบว่าถ้าข้อมูลวันที่ถูกส่งมาเป็นรูปแบบ ISO Date (มีตัว T หรือ Z)
                            if (displayDate && (displayDate.toString().includes('T') || displayDate.toString().includes('Z'))) {
                                let dateObj = new Date(displayDate);
                                // แปลงให้เป็นวันที่แบบไทยโดยไม่สน Timezone ที่คลาดเคลื่อน
                                displayDate = dateObj.toLocaleDateString('th-TH', {
                                    year: 'numeric',
                                    month: '2-digit',
                                    day: '2-digit'
                                });
                            }

                            let displayAmount = "";
                            let amountColor = "#333";
                            let statusColor = "#166534";
                            let statusBg = "#dcfce7";

                            if (item.status === "เพิ่มยอดค้าง" || item.amount === "-") {
                                displayAmount = "180 บาท";
                                amountColor = "#e53e3e";
                                statusColor = "#9b2c2c";
                                statusBg = "#fff5f5";

                                // ถ้าในช่อง A (date) มีข้อมูลวันที่ให้ใช้ข้อมูลนั้น 
                                // แต่ถ้ายังเป็น "-" ให้แสดงข้อความแทน
                                if (displayDate === "-") {
                                    displayDate = "รายการเพิ่มยอดรายสัปดาห์";
                                }
                            }
                            // 2. ถ้าเป็นรายการโอนปกติ (มีตัวเลขยอดเงิน)
                            else {
                                const val = parseFloat(item.amount);
                                if (!isNaN(val)) {
                                    displayAmount = "+" + val.toLocaleString() + " บาท";
                                    amountColor = "#38a169"; // ตัวเลขสีเขียว
                                } else {
                                    displayAmount = item.amount;
                                }
                            }

                            const itemHtml = `
                                <div class="history-item">
                                    <div style="display:flex; flex-direction:column; align-items:flex-start;">
                                        <div style="font-weight:bold; font-size:1.1em; color: ${amountColor};">
                                            ${displayAmount}
                                        </div>
                                        <div style="font-size:0.85em; color:#888;">
                                            📅 ${displayDate} 
                                            ${(item.slip && item.slip !== "-") ? `<a href="${item.slip}" target="_blank" style="margin-left:5px; text-decoration:none;">📄 ดูสลิป</a>` : ""}
                                        </div>
                                    </div>
                                    <span class="status-badge" style="background: ${statusBg}; color: ${statusColor};">
                                        ${item.status || "ยืนยันแล้ว"}
                                    </span>
                                </div>`;
                            listEl.insertAdjacentHTML('beforeend', itemHtml);
                        });
                    } else {
                        if (balanceEl) balanceEl.innerText = "1,080.00 บาท";
                        listEl.innerHTML = '<p style="text-align:center;">ไม่มีรายการโอนล่าสุด</p>';
                    }
                })
                .catch(e => { console.error("Load Data Error:", e); if (balanceEl) balanceEl.innerText = "Error"; });
        }

        window.onload = function () {
            loadData();
        };

        window.onclick = function (event) { if (event.target == document.getElementById('paymentModal')) { closeModal(); } }
    </script>
</body>

</html>
